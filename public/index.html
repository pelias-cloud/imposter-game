<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMPOSTER | Party Game</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f6f3ff;background:#100e1c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#3b2058,transparent 55%),#100e1c}main{max-width:600px;margin:auto;padding:32px 18px 70px}h1{font-size:48px;letter-spacing:5px;margin:20px 0 2px}h2{font-size:24px;margin:12px 0}.muted{color:#b8afc9}.card{background:#211b33;border:1px solid #423556;border-radius:20px;padding:22px;margin:18px 0;box-shadow:0 8px 30px #08061355}input,select{width:100%;background:#110f1e;color:white;border:1px solid #625575;border-radius:12px;padding:15px;font-size:16px;margin:8px 0 14px}button{background:#bc75ff;color:#140c20;border:0;border-radius:12px;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer}button.secondary{background:#403352;color:white}button:disabled{opacity:.4;cursor:not-allowed}.buttons{display:flex;gap:10px;flex-wrap:wrap}.buttons button{flex:1}.pill{display:inline-block;background:#403252;padding:7px 11px;border-radius:99px;margin:4px;font-size:13px}.hidden{display:none!important}.code{font-size:36px;letter-spacing:8px;font-weight:900;color:#d8b1ff}.clue{background:#302642;padding:12px;border-radius:12px;margin:8px 0}.highlight{color:#d8b1ff}.big{font-size:28px;font-weight:800}.status{margin-top:12px;color:#f7b0b0;min-height:22px}.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 20px}.cat{padding:13px;border:1px solid #594474;border-radius:12px;background:#2b2140;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:14px}.cat input{width:auto;margin:0;accent-color:#bc75ff}.divider{height:1px;background:#493b59;margin:20px 0}</style></head><body><main><div style="font-size:32px">🕵️</div><h1>IMPOSTER</h1><p class="muted">One word. Hidden imposters. Trust no one.</p><section id="entry" class="card"><h2>Play with friends</h2><label>Your name</label><input id="name" maxlength="24" placeholder="Enter your name"><div class="buttons"><button id="create">Create room</button></div><div class="divider"></div><label>Room code</label><input id="code" maxlength="6" placeholder="ABC123"><button class="secondary" id="join">Join room</button></section><section id="game" class="hidden"><div class="card"><div class="muted">ROOM CODE</div><div id="roomCode" class="code"></div><div class="buttons"><button class="secondary" id="share">Copy invite link</button></div><p id="hostText" class="muted"></p><h2>Players <span id="playerCount"></span></h2><div id="players"></div></div><div id="lobby" class="card hidden"><h2>Game settings</h2><div id="hostSettings"><label>Clue rounds before voting</label><select id="clueRounds"><option value="1">1 round</option><option value="2">2 rounds</option><option value="3">3 rounds</option><option value="4">4 rounds</option><option value="5">5 rounds</option><option value="6">6 rounds</option><option value="7">7 rounds</option><option value="8">8 rounds</option><option value="9">9 rounds</option><option value="10">10 rounds</option></select><label>Choose categories (select multiple)</label><div class="buttons"><button class="secondary" id="selectAll" type="button">Select all</button><button class="secondary" id="clearAll" type="button">Clear all</button></div><div id="categoryGrid" class="catgrid"></div><label>Imposters</label><select id="imposters"><option value="auto">Automatic</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select><button id="start">Start game</button></div><p id="wait" class="muted hidden">Waiting for host to start…</p></div><div id="playing" class="hidden"><div class="card"><div class="muted">YOUR SECRET ROLE</div><div id="role" class="big">Waiting for role…</div><button class="secondary" id="hideRole">Hide role</button></div><div id="clueArea" class="card hidden"><h2 id="roundTitle"></h2><p id="turnText"></p><div id="clueInput" class="hidden"><input id="clueText" maxlength="100" placeholder="Give a short clue"><button id="sendClue">Submit clue</button></div><h3>Clues so far</h3><div id="clues"></div></div><div id="voteArea" class="card hidden"><h2>Vote for the imposter</h2><p class="muted">Choose one player. Votes are final.</p><div id="voteButtons"></div><p id="voteStatus"></p></div><div id="results" class="card hidden"><h2>Round results</h2><div id="resultText"></div><button id="again" class="hidden">Play again</button></div></div></section><p id="status" class="status"></p></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let room=null,myId=null,token=localStorage.getItem('imposter_token'),secret=null,roleHidden=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const show=(id,on)=>$(id).classList.toggle('hidden',!on);const msg=s=>$('status').textContent=s;const call=(event,data,cb)=>socket.emit(event,data,res=>{if(!res?.ok)return msg(res?.error||'Something went wrong');msg('');cb?.(res)});
function enter(res){token=res.token;myId=res.id;localStorage.setItem('imposter_token',token);localStorage.setItem('imposter_room',res.code);history.replaceState({},'',`?room=${res.code}`);show('entry',false);show('game',true)}
$('create').onclick=()=>call('create',{name:$('name').value},enter);$('join').onclick=()=>call('join',{name:$('name').value,code:$('code').value,token:($('code').value.toUpperCase()===localStorage.getItem('imposter_room')?token:null)},enter);
$('share').onclick=()=>{let url=location.origin+'/?room='+room.code;navigator.clipboard?.writeText(url).then(()=>msg('Invite link copied')).catch(()=>prompt('Copy invite link',url));};$('start').onclick=()=>call('settings',{settings:{clueRounds:Number($('clueRounds').value),categories:[...document.querySelectorAll('.cat input:checked')].map(x=>x.value),imposters:$('imposters').value}},()=>call('start',{}));$('sendClue').onclick=()=>call('clue',{text:$('clueText').value},()=>{$('clueText').value=''});$('hideRole').onclick=()=>{roleHidden=!roleHidden;renderRole()};$('again').onclick=()=>call('start',{});
function renderRole(){if(!secret){$('role').textContent='Waiting for role…';return}$('role').textContent=roleHidden?'••••••':secret.imposter?'YOU ARE AN IMPOSTER 🕵️':'WORD: '+secret.word;$('hideRole').textContent=roleHidden?'Reveal role':'Hide role'}
socket.on('role',r=>{secret=r;roleHidden=false;renderRole()});socket.on('room',r=>{room=r;if(!$('categoryGrid').children.length){$('categoryGrid').innerHTML=r.categories.map(c=>`<label class="cat"><input type="checkbox" value="${esc(c)}" checked> ${esc(c)}</label>`).join('')}show('entry',false);show('game',true);$('roomCode').textContent=r.code;let host=r.host===myId;$('hostText').textContent=host?'You are the host':'Host: '+(r.players.find(p=>p.id===r.host)?.name||'Unknown');$('playerCount').textContent=`(${r.players.length})`;$('players').innerHTML=r.players.map(p=>`<span class="pill">${esc(p.name)}${p.id===r.host?' 👑':''}${!p.online?' ◌':''}</span>`).join('');show('lobby',r.phase==='lobby');show('playing',r.phase!=='lobby');show('hostSettings',host);show('wait',!host);if(r.phase==='lobby'){$('clueRounds').value=r.settings.clueRounds||1;document.querySelectorAll('.cat input').forEach(x=>x.checked=r.settings.categories.includes(x.value));$('imposters').value=r.settings.imposters;secret=null}show('clueArea',r.phase==='clues');show('voteArea',r.phase==='vote');show('results',r.phase==='results');if(r.phase==='clues'){$('roundTitle').textContent=`Clue round · ${r.round} of ${r.settings.clueRounds}`;let next=r.order[r.turn%r.order.length],p=r.players.find(x=>x.id===next);$('turnText').textContent=next===myId?'Your turn! Submit a clue.':`Waiting for ${p?.name||'player'}…`;show('clueInput',next===myId);$('clues').innerHTML=r.clues.map(c=>`<div class="clue"><b>${esc(c.name)}</b> · Round ${c.round}<div>${esc(c.text)}</div></div>`).join('')||'<p class="muted">No clues yet.</p>'}if(r.phase==='vote'){$('voteButtons').innerHTML=r.players.filter(p=>p.id!==myId).map(p=>`<button class="secondary" style="margin:5px" data-vote="${p.id}">${esc(p.name)}</button>`).join('');document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>call('vote',{target:b.dataset.vote},()=>{$('voteStatus').textContent='Vote submitted.'}));$('voteStatus').textContent=`${r.votesCount}/${r.players.length} votes submitted`;}if(r.phase==='results'){let imposters=r.players.filter(p=>r.results.imposterIds.includes(p.id)).map(p=>p.name).join(', ');let eliminated=r.players.find(p=>p.id===r.results.eliminated);$('resultText').innerHTML=`<p>Category: <b>${esc(r.selectedCategory||'Random')}</b></p><p>Secret word: <b>${esc(r.results.word)}</b></p><p>Imposters: <b>${esc(imposters)}</b></p><p>${eliminated?'Most votes: '+esc(eliminated.name):'Tie vote — nobody eliminated.'}</p><p>${eliminated&&r.results.imposterIds.includes(eliminated.id)?'🎉 You found an imposter!':'🕵️ The imposters escaped this vote!'}</p>`;show('again',host)}});
$('selectAll').onclick=()=>document.querySelectorAll('.cat input').forEach(x=>x.checked=true);$('clearAll').onclick=()=>document.querySelectorAll('.cat input').forEach(x=>x.checked=false);const urlCode=new URLSearchParams(location.search).get('room');if(urlCode)$('code').value=urlCode.toUpperCase();socket.on('connect',()=>{let c=localStorage.getItem('imposter_room'),t=localStorage.getItem('imposter_token');if(c&&t&&(!urlCode||urlCode.toUpperCase()===c))call('join',{code:c,token:t},enter)});
</script></body></html>
